<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- The signature, at 16px: one lifted brass block for NOW, two flat
       receding lines for the periphery. Dark scheme is honored where the
       browser supports it and ignored harmlessly where it doesn't. -->
  <style>
    .ground { fill: #F2EFE8 }
    .card   { fill: #A07A2E }
    .periph { fill: #C2BAA8 }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #161E28 }
      .card   { fill: #C6A15B }
      .periph { fill: #3A4652 }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="6"/>
  <rect class="card" x="6" y="6.5" width="20" height="9.5" rx="1"/>
  <rect class="periph" x="6" y="20" width="20" height="1.8" rx="0.9"/>
  <rect class="periph" x="6" y="24.5" width="12.5" height="1.8" rx="0.9" opacity="0.6"/>
</svg>
